[pytest]
# Test degli strumenti della documentazione. Da lanciare con il venv del
# backend, per esempio:
#   PYTHONWARNDEFAULTENCODING=1 python -m pytest scripts/documentazione/tests
testpaths = tests
addopts = -q --strict-markers --strict-config -p no:cacheprovider
markers =
    lento: test che importano l'applicazione o lanciano Node
filterwarnings =
    error
