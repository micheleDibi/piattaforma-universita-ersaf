# Incluso solo con NOTIFICHE_REALI=si in shared/compose.env.
# Abilita uscita dell'API verso i provider SMTP/HTTPS; non pubblica porte.
# Il DB resta sulla sola rete interna data. Il firewall installato dal deploy
# limita questo bridge a HTTPS/SMTP pubblici e blocca LAN e servizi dell'host.
services:
  api:
    networks: [app, data, notifiche]
networks:
  notifiche:
    driver_opts:
      com.docker.network.bridge.name: br-uni-notify
