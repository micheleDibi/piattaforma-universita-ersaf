[pytest]
# `pythonpath = .` mette backend/ in sys.path a inizio sessione: e' cio' che fa
# funzionare `from src.xxx import ...` senza __init__.py (il repo non ne ha
# nessuno) e senza manipolare sys.path a mano nel conftest.
pythonpath = .
testpaths = tests

# Con la modalita' `prepend` di default e senza __init__.py, due file di test
# con lo stesso nome in cartelle diverse danno "import file mismatch".
# --import-mode non ha una chiave ini propria: va in addopts.
consider_namespace_packages = true

# I test dei tempi sono esclusi per difetto: una misura di latenza e'
# intrinsecamente rumorosa e non deve far fallire la suite a caso.
# Si eseguono con `pytest -m timing`.
addopts = -q --strict-markers --strict-config --import-mode=importlib -m "not timing"

markers =
    mariadb: richiede un MariaDB reale (TEST_DATABASE_URL); saltato se non raggiungibile
    timing: misura i tempi di risposta; escluso per difetto
    lento: oltre due secondi

filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore::DeprecationWarning:passlib.*
