# Server statico della SPA e reverse proxy verso l'API.
# Il file e' incluso dentro il blocco http{} dell'immagine ufficiale, quindi
# log_format e' ammesso a questo livello.

# Niente query string nel log: il link di reset porta il token nell'URL.
log_format senza_query '$remote_addr - [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log senza_query;

    # Le intestazioni di sicurezza stanno solo qui: un add_header dentro una
    # location azzererebbe quelle del livello server.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/... -> api:8000/... con il prefisso rimosso. Risoluzione DNS
    # dinamica: quando il container api viene ricreato cambia indirizzo, e un
    # upstream risolto una sola volta all'avvio continuerebbe a puntare a
    # quello vecchio.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Asset con hash nel nome: cache lunga. index.html mai in cache.
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        expires epoch;
    }

    # Fallback SPA per i deep link (/elenco, /reimposta-password?token=...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
